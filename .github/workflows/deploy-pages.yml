name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: weimo-ui-editor
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: weimo-ui-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: weimo-ui-editor
      - run: pnpm site:build
        working-directory: weimo-ui-editor
      - name: Add SPA fallback page
        run: cp site/dist/index.html site/dist/404.html
        working-directory: weimo-ui-editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: weimo-ui-editor/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
