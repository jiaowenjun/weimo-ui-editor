name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: weimo-ui-editor
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: weimo-ui-editor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: weimo-ui-editor
      - run: pnpm verify
        working-directory: weimo-ui-editor
