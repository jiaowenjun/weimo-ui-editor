name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: weimo-ui-markdown
      - uses: actions/checkout@v4
        with:
          repository: jiaowenjun/weimo-doc-ts
          ref: c1efa7e0265687569f4a9dca37e5293095311e1a
          path: weimo-doc-ts
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: weimo-ui-markdown/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: weimo-ui-markdown
      - run: pnpm verify
        working-directory: weimo-ui-markdown
